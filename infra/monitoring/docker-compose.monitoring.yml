# Optional monitoring overlay — layer this on top of the main
# docker-compose.yml rather than editing it directly, so a plain
# `docker compose up` (local dev) never pays for Prometheus/Grafana/
# Alertmanager it isn't using:
#
#   docker compose -f docker-compose.yml -f infra/monitoring/docker-compose.monitoring.yml up
#
# Standard, unmodified OSS images — no custom monitoring code to
# maintain, and nothing here requires an npm install (a common blocker
# elsewhere in this repo's sandboxed build history — see every Phase 9
# file's own note on that).
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '9090:9090'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - '9093:9093'

  grafana:
    image: grafana/grafana-oss:11.1.0
    restart: unless-stopped
    environment:
      # Change on first login in any environment that isn't a throwaway
      # local sandbox — this is a placeholder, not a real credential.
      GF_SECURITY_ADMIN_PASSWORD: changeme
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - '3009:3000'
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
